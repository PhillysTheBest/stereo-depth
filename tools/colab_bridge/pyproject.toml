[project]
name = "colab-bridge"
version = "0.1.0"
description = "Run commands and notebooks on a Colab GPU from a remote agent, over an encrypted tunnel"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.scripts]
colab-bridge = "colab_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colab_bridge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
strict = true
packages = ["colab_bridge"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
