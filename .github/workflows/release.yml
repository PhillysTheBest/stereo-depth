name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [stereo-depth-api, stereo-depth-api-gpu, stereo-depth-web]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - run: |
          src=ghcr.io/phillysthebest/${{ matrix.image }}:${{ github.sha }}
          docker buildx imagetools create -t "${src%:*}:${GITHUB_REF_NAME}" -t "${src%:*}:latest" "$src"

  github-release:
    needs: retag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Production deploy (HF_TOKEN push to Spaces) is added in Sprint 4.
