name: gpu-tests

on:
  workflow_dispatch:

jobs:
  gpu:
    # Needs a self-hosted runner labelled "gpu". Until one exists, run `pytest -m gpu` in Colab.
    runs-on: [self-hosted, gpu]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: |
          uv sync --frozen --extra gpu
          uv run pytest -m gpu
