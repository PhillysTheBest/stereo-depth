name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: stereo-depth-api
            context: backend
            file: backend/Dockerfile
          - image: stereo-depth-api-gpu
            context: backend
            file: backend/Dockerfile.gpu
          - image: stereo-depth-web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/phillysthebest/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/phillysthebest/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  # Staging deploy is added in Sprint 4 (Hugging Face Spaces for the API; Vercel deploys the web app itself).
