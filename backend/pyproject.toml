[project]
name = "stereo-depth"
version = "0.1.0"
description = "Stereo disparity, depth and point clouds from image pairs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "imageio>=2.36",
    "plyfile>=1.1",
]

[project.scripts]
stereo-bench = "stereo_depth.eval.bench:main"

[project.optional-dependencies]
gpu = ["torch>=2.5"]
track = ["wandb>=0.18"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stereo_depth"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
strict = true
packages = ["stereo_depth"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU (skipped in CI)"]
addopts = "--strict-markers"

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "plyfile", "wandb"]
ignore_missing_imports = true
